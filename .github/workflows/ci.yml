name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interop:
    name: JSON Atom TypeScript / Python interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ltwlf/json-atom-py
          ref: 40ccd5520b08757c5a16453889a1e4dea263c0b0
          path: .interop/python
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-interop.mjs
        env:
          JSON_ATOM_PYTHON: python
          JSON_ATOM_PY_SOURCE: ${{ github.workspace }}/.interop/python/src

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run lint
      - run: npm run typecheck
      
      - name: Upload coverage reports
        if: matrix.node-version == 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7
          
      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v6
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          
      - name: Create job summary
        if: matrix.node-version == 20 && always()
        run: |
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js version:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Test coverage:** Generated and uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- **Linting:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
