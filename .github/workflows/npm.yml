name: Publish

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run lint
      - run: npm run typecheck
      
      - name: Upload build artifacts
        if: matrix.node-version == 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # For creating tags
      id-token: write   # For npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: 'npm'
          
      - run: npm ci --ignore-scripts
      - run: npm run build
      
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: dist/
      
      - name: Determine release type
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "RELEASE_TYPE=preview" >> $GITHUB_OUTPUT
            echo "Release type: preview (pre-release)"
          else
            echo "RELEASE_TYPE=latest" >> $GITHUB_OUTPUT
            echo "Release type: latest (stable)"
          fi
          
      - name: Publish package with trusted publishing
        id: publish
        env:
          RELEASE_TYPE: ${{ steps.prep.outputs.RELEASE_TYPE }}
        run: |
          npm --version
          npm publish --provenance --access public --ignore-scripts --tag "$RELEASE_TYPE"

      - name: Create release tag
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists on remote
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists, skipping tag creation"
          else
            # Create and push tag
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
          fi

      - name: Create release summary
        if: always()
        run: |
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.prep.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release type:** ${{ steps.prep.outputs.RELEASE_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish result:** ${{ steps.publish.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** https://registry.npmjs.org" >> $GITHUB_STEP_SUMMARY
          echo "- **Authentication:** npm trusted publishing (OIDC)" >> $GITHUB_STEP_SUMMARY
