name: Publish

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run lint
      - run: npx tsc --noEmit
      
      - name: Upload build artifacts
        if: matrix.node-version == 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # For creating tags
      id-token: write   # For npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'npm'
          
      - run: npm ci --ignore-scripts
      - run: npm run build
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts
          path: dist/
      
      - name: Determine release type
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF_NAME" != "v4" || ! "$VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]; then
            echo "The maintenance workflow only publishes stable 4.x versions from v4."
            exit 1
          fi
          echo "RELEASE_TYPE=legacy-v4" >> $GITHUB_OUTPUT
          echo "Release type: legacy-v4 (maintenance; latest remains on v5)"
          
      - name: Publish package with trusted publishing
        id: publish
        env:
          RELEASE_TYPE: ${{ steps.prep.outputs.RELEASE_TYPE }}
        run: |
          npm --version
          npm publish --provenance --access public --ignore-scripts --tag "$RELEASE_TYPE"

      - name: Create release tag
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists on remote
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists, skipping tag creation"
          else
            # Create and push tag
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
          fi

      - name: Create release summary
        if: always()
        run: |
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.prep.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release type:** ${{ steps.prep.outputs.RELEASE_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish result:** ${{ steps.publish.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** https://registry.npmjs.org" >> $GITHUB_STEP_SUMMARY
          echo "- **Authentication:** npm trusted publishing (OIDC)" >> $GITHUB_STEP_SUMMARY
